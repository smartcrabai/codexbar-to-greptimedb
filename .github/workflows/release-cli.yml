name: Release CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: macos-x86_64
          - runner: macos-15
            target: macos-arm64
          - runner: ubuntu-24.04
            target: linux-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libcurl4-openssl-dev libsqlite3-dev
      - name: Run unit tests
        run: swift test
      - name: Build release binary
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            swift build --configuration release \
              --product codexbar-to-greptimedb \
              --static-swift-stdlib
          else
            swift build --configuration release --product codexbar-to-greptimedb
          fi
      - name: Sign and notarize macOS app
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail

          binary=".build/release/codexbar-to-greptimedb"
          app="$RUNNER_TEMP/CodexBarToGreptimeDB.app"
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/signing.keychain-db"
          notary_archive="$RUNNER_TEMP/codexbar-to-greptimedb-$TARGET.zip"
          keychain_password="$(openssl rand -base64 32)"
          trap 'security delete-keychain "$keychain_path" >/dev/null 2>&1 || true; rm -f "$certificate_path" "$notary_archive"' EXIT

          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode >"$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" |
              awk '/Developer ID Application/ { print $2; exit }'
          )"
          if [ -z "$signing_identity" ]; then
            printf '%s\n' 'error: Developer ID Application identity not found' >&2
            exit 1
          fi

          rm -rf "$app"
          mkdir -p "$app/Contents/MacOS"
          cp "$binary" "$app/Contents/MacOS/codexbar-to-greptimedb"
          cp packaging/macos/Info.plist "$app/Contents/Info.plist"
          version="${GITHUB_REF_NAME#v}"
          plutil -replace CFBundleShortVersionString -string "$version" \
            "$app/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$GITHUB_RUN_NUMBER" \
            "$app/Contents/Info.plist"

          codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "$signing_identity" \
            "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          ditto -c -k --keepParent "$app" "$notary_archive"
          notary_result="$(
            xcrun notarytool submit "$notary_archive" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --wait \
              --output-format json
          )"
          printf '%s\n' "$notary_result"
          notary_status="$(printf '%s' "$notary_result" | plutil -extract status raw -o - -)"
          if [ "$notary_status" != 'Accepted' ]; then
            printf 'error: notarization status is %s\n' "$notary_status" >&2
            exit 1
          fi

          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
      - name: Package release archive
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          binary=codexbar-to-greptimedb
          version_without_prefix="${VERSION#v}"
          asset_name="$binary-$version_without_prefix-$TARGET.tar.gz"
          mkdir -p dist/staging
          if [ "$RUNNER_OS" = "macOS" ]; then
            archive_root="$binary"
            mkdir -p "dist/staging/$archive_root"
            ditto "$RUNNER_TEMP/CodexBarToGreptimeDB.app" \
              "dist/staging/$archive_root/CodexBarToGreptimeDB.app"
            payload="$archive_root"
          else
            cp ".build/release/$binary" "dist/staging/$binary"
            payload="$binary"
          fi
          tar -C dist/staging -czf "dist/$asset_name" "$payload"
          (
            cd dist
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$asset_name" > "$asset_name.sha256"
            else
              sha256sum "$asset_name" > "$asset_name.sha256"
            fi
          )
      - name: Smoke test macOS app bundle
        if: runner.os == 'macOS'
        run: |
          set -eu
          app="$RUNNER_TEMP/CodexBarToGreptimeDB.app"
          test -x "$app/Contents/MacOS/codexbar-to-greptimedb"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$app/Contents/Info.plist")" = \
            "com.smartcrabai.codexbar-to-greptimedb"
          "$app/Contents/MacOS/codexbar-to-greptimedb" --help

      - name: Smoke test Linux release archive
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          asset_name="codexbar-to-greptimedb-${VERSION#v}-$TARGET.tar.gz"
          docker run --rm \
            --volume "$PWD/dist:/dist:ro" \
            --env ASSET_NAME="$asset_name" \
            ubuntu:24.04 \
            bash -ceu '
              apt-get update -qq
              apt-get install -y -qq curl libsqlite3-0
              mkdir /release
              tar -xzf "/dist/$ASSET_NAME" -C /release
              /release/codexbar-to-greptimedb --help
            '
      - name: Upload release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Verify release checksums
        working-directory: release
        run: |
          set -eu
          for checksum in *.sha256; do
            sha256sum --check "$checksum"
          done
      - name: Publish complete release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if gh release view "$TAG" --json isDraft --jq '.isDraft' >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
            if [ "$is_draft" != "true" ]; then
              printf '%s\n' "error: release $TAG is already published" >&2
              exit 1
            fi
          else
            gh release create "$TAG" \
              --draft \
              --title "codexbar-to-greptimedb $TAG" \
              --generate-notes
          fi
          gh release upload "$TAG" release/* --clobber
          gh release edit "$TAG" --draft=false


  publish-homebrew:
    name: Publish Homebrew Formula
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-macos-*
          path: release
          merge-multiple: true
      - name: Checkout Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: smartcrabai/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Generate Homebrew formula
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          arm64_asset="codexbar-to-greptimedb-${version}-macos-arm64.tar.gz"
          x86_64_asset="codexbar-to-greptimedb-${version}-macos-x86_64.tar.gz"

          VERSION="$TAG" \
            REPOSITORY="$REPOSITORY" \
            MACOS_ARM64_SHA256="$(cut -d ' ' -f 1 "release/${arm64_asset}.sha256")" \
            MACOS_X86_64_SHA256="$(cut -d ' ' -f 1 "release/${x86_64_asset}.sha256")" \
            OUTPUT="homebrew-tap/Formula/codexbar-to-greptimedb.rb" \
            bash scripts/generate-homebrew-formula.sh
      - name: Commit formula
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          formula="Formula/codexbar-to-greptimedb.rb"
          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add "$formula"
          if git -C homebrew-tap diff --cached --quiet; then
            exit 0
          fi
          git -C homebrew-tap commit -m "codexbar-to-greptimedb ${TAG}"
          git -C homebrew-tap push
